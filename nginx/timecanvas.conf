# TimeCanvas site. Installed to /etc/nginx/sites-available/timecanvas by scripts/install.sh.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/timecanvas/certificates/timecanvas.crt;
    ssl_certificate_key /etc/timecanvas/certificates/timecanvas.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:2m;

    auth_basic "TimeCanvas";
    auth_basic_user_file /etc/timecanvas/nginx/htpasswd;   # created interactively by the owner; never in git

    autoindex off;
    client_max_body_size 64k;
    limit_req zone=tc_all burst=120 nodelay;
    limit_req zone=tc_post burst=20 nodelay;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Live MJPEG: only the stream path is exposed (not /state, /snapshot or ustreamer's other endpoints).
    location = /live/stream {
        if ($tc_cross_site) { return 403; }
        limit_conn tc_conn 6;
        proxy_pass http://127.0.0.1:8080/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header Cache-Control "no-store" always;
    }
    location /live/ { return 404; }

    # Large transfers (zips, videos): stream straight through instead of buffering to nginx's temp files.
    location ~ ^/(media/|library/bulk$|storage/day$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Remote-User $remote_user;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_read_timeout 900s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Remote-User $remote_user;     # overwrites anything the client sent
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
