# http-level settings for TimeCanvas (conf.d). No secrets.
map $request_method $tc_post_key { default ""; POST $binary_remote_addr; }
limit_req_zone $tc_post_key zone=tc_post:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=tc_all:5m rate=60r/s;
limit_conn_zone $binary_remote_addr zone=tc_conn:1m;
map $http_sec_fetch_site $tc_cross_site { default 0; "cross-site" 1; }
